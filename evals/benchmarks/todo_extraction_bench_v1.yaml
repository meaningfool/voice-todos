benchmark_id: todo_extraction_bench_v1
hosted_dataset: fdf39527-c44e-4368-a6d1-ffd17f41c6df
dataset_family: extraction
focus: model
headline_metric: todo_count_match
repeat: 1
task_retries: 1
max_concurrency: 1
entries:
- id: gemini3_flash_default
  label: Gemini 3 Flash / default
  config:
    provider: google-gla
    model: gemini-3-flash-preview
    prompt_version: v1
    model_settings: {}
- id: gemini3_flash_minimal_thinking
  label: Gemini 3 Flash / minimal thinking
  config:
    provider: google-gla
    model: gemini-3-flash-preview
    prompt_version: v1
    model_settings:
      google_thinking_config:
        thinking_level: minimal
- id: gemini31_flash_lite_default
